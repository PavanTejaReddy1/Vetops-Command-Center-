version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: vetops-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: vetops
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - vetops-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vetops-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/vetops
      - JWT_SECRET=${JWT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - FRONTEND_URL=http://localhost:80
    depends_on:
      - mongodb
    networks:
      - vetops-network
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vetops-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - vetops-network

volumes:
  mongodb_data:

networks:
  vetops-network:
    driver: bridge
